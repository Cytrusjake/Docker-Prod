version: "3.9"

services:

  php:
    build: .
    container_name: php

    volumes:
      - /var/www/html:/var/www/html
      - /etc/tenant-php/conf.d:/usr/local/etc/php/conf.d:ro

    depends_on:
      - mariadb
      - redis
      - memcached

    restart: unless-stopped

  cron:
    build:
      context: ./cron

    container_name: cron

    command: >
      sh -c "
        if [ -f /etc/tenant-cron/crontab ]; then
          crontab /etc/tenant-cron/crontab;
        fi;
        exec cron -f
      "

    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /etc/tenant-cron:/etc/tenant-cron

    restart: unless-stopped

  nginx:
    build:
      context: ./nginx

    container_name: nginx

    volumes:
      - /var/www/html:/var/www/html:ro
      - /etc/tenant-nginx/user-snippets:/etc/nginx/user-snippets

    environment:
      PUBLIC_DOMAIN: ${PUBLIC_DOMAIN:?PUBLIC_DOMAIN is required}

    depends_on:
      - php

    expose:
      - "80"

    restart: unless-stopped

  varnish:
    build:
      context: ./varnish

    container_name: varnish

    depends_on:
      - nginx

    ports:
      - "8081:80"

    restart: unless-stopped

  mariadb:
    image: mariadb:10.11
    container_name: mariadb

    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}

    volumes:
      - /var/lib/mysql:/var/lib/mysql

    restart: unless-stopped

  redis:
    image: redis:7
    container_name: redis

    restart: unless-stopped

  memcached:
    image: memcached:latest
    container_name: memcached

    restart: unless-stopped

  phpmyadmin:
    image: phpmyadmin/phpmyadmin:5.2
    container_name: phpmyadmin

    depends_on:
      - mariadb

    environment:
      PMA_HOST: mariadb
      PMA_PORT: 3306
      UPLOAD_LIMIT: 256M

    ports:
      - "8090:80"

    restart: unless-stopped